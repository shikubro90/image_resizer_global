<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Image frame -->
  <rect x="4" y="6" width="18" height="14" rx="2" fill="none" stroke="white" stroke-width="1.8" opacity="0.95"/>
  <!-- Mountain inside frame -->
  <polygon points="6,18 11,12 14,15 17,13 22,18" fill="white" opacity="0.9"/>
  <!-- Sun dot -->
  <circle cx="19" cy="10" r="1.8" fill="white" opacity="0.95"/>
  <!-- Resize arrow: bottom-right corner bracket -->
  <polyline points="19,24 27,24 27,16" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Diagonal arrow tip -->
  <line x1="21" y1="22" x2="27" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
